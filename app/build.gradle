plugins {
    // Kotlin support is built into AGP 9+; the org.jetbrains.kotlin.android
    // plugin is no longer applied. See https://kotl.in/gradle/agp-built-in-kotlin
    id 'com.android.application'
    id 'com.google.gms.google-services'
    id 'com.google.firebase.crashlytics'
}

android {

    def getAppVersionCode = { ->
        return 32
    }

    def getAppVersionName = { ->
        return "1.10"
    }

    compileSdk 37

    defaultConfig {
        applicationId "com.loaiza.software.whitescreen"
        minSdk 24
        targetSdk 37
        //versionCode 7
        //versionName "1.6"

        testInstrumentationRunner "androidx.test.runner.AndroidJUnitRunner"
    }

    buildFeatures {
        // Required from AGP 9: the android.defaults.buildfeatures.buildconfig
        // property was removed, and buildConfigField below needs this on.
        buildConfig true
    }

    flavorDimensions = ["environment"]
    productFlavors {
        prod {
            dimension "environment"
            //applicationIdSuffix ".prod"
            buildConfigField("String", "ENVIRONMENT", "\"prod\"")
            versionCode getAppVersionCode()
            versionName "prodRelease-v${getAppVersionName()}"
        }
        dev {
            dimension "environment"
            applicationIdSuffix ".dev"
            buildConfigField("String", "ENVIRONMENT", "\"dev\"")
            versionCode getAppVersionCode()
            versionName "devRelease-v${getAppVersionName()}"
        }
    }


    buildTypes {
        release {
            minifyEnabled false
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
        }
    }
    compileOptions {
        sourceCompatibility JavaVersion.VERSION_11
        targetCompatibility JavaVersion.VERSION_11
    }
    namespace 'com.loaiza.software.whitescreen'
}

// AGP 9 removed the android.kotlinOptions block; JVM target is now set on the
// built-in Kotlin plugin's compilerOptions.
kotlin {
    compilerOptions {
        jvmTarget = org.jetbrains.kotlin.gradle.dsl.JvmTarget.JVM_11
    }
}

dependencies {

    implementation 'androidx.core:core-ktx:1.10.0'
    implementation 'androidx.appcompat:appcompat:1.6.1'
    implementation 'com.google.android.material:material:1.9.0'
    implementation 'androidx.constraintlayout:constraintlayout:2.1.4'

    // Import the Firebase
    implementation platform('com.google.firebase:firebase-bom:34.1.0')

    // Add the dependency for the Firebase SDK for Google Analytics
    // When using the BoM, don't specify versions in Firebase dependencies
    implementation("com.google.firebase:firebase-analytics")

    //Crashlytics
    implementation 'com.google.firebase:firebase-crashlytics:19.0.3'

    //In App Updates
    implementation 'com.google.android.play:app-update:2.1.0'
    // For Kotlin users also add the Kotlin extensions library for Play In-App Update
    implementation 'com.google.android.play:app-update-ktx:2.1.0'

    // Add the dependencies for the Remote Config
    implementation("com.google.firebase:firebase-config")


    testImplementation 'junit:junit:4.13.2'
    androidTestImplementation 'androidx.test.ext:junit:1.1.5'
    androidTestImplementation 'androidx.test.espresso:espresso-core:3.5.1'
}